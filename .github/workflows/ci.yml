name: CI

on:
  push:
    branches: [main]
    # README.md files are the only .md tracked in git (see .gitignore's
    # blanket "*.md" + "!README.md" rule) — there's one at the repo root
    # and one under settings-ui/ (Vite's default template file). A push
    # that only touches either has nothing for this build/test job to
    # actually verify. The ** prefix is required: an unprefixed pattern
    # only matches the file at the repo root, not settings-ui/README.md.
    paths-ignore:
      - "**/README.md"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  settings-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settings-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settings-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
